<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Prezență</title>
</head>
<body>
<div class="content">
  {% with messages = get_flashed_messages() %}
    {% if messages %}<p class="flash">{{ messages[0] }}</p>{% endif %}
  {% endwith %}

  <h1>Prezență — {{ sesiune.data.strftime('%d %b %Y') }} ({{ sesiune.ora }})</h1>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% for sportiv in sportivi %}
      <label style="flex-direction: row; align-items: center; gap: 8px;">
        <input type="checkbox" name="prezenta_{{ sportiv.id }}"
               {% if prezente_curente.get(sportiv.id) %}checked{% endif %}>
        {{ sportiv.prenume }} {{ sportiv.nume }}
      </label>
    {% endfor %}
    <button type="submit">Salvează prezența</button>
  </form>

  <a href="{{ url_for('schedule') }}">Înapoi la program</a>
</div>
</body>
</html>
