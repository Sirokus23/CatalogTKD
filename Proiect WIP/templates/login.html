<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Log in</title>
</head>
<body>
<div class="content">
  {% with messages = get_flashed_messages() %}
    {% if messages %}<p class="flash">{{ messages[0] }}</p>{% endif %}
  {% endwith %}

  <h1>Log in</h1>
  <form method="POST">
    <label>Email<input type="email" name="email" required></label>
    <label>Parolă<input type="password" name="password" required></label>
    <button type="submit">Log in</button>
  </form>

  <p>Nu ai cont? <a href="{{ url_for('register') }}">Înregistrează-te</a></p>
  <p><a href="{{ url_for('forgot_password') }}">Am uitat parola</a></p>
</div>
</body>
</html>
