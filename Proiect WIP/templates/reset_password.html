<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Resetare parolă</title>
</head>
<body>
<div class="content">
  {% with messages = get_flashed_messages() %}
    {% if messages %}<p class="flash">{{ messages[0] }}</p>{% endif %}
  {% endwith %}

  <h1>Setează o parolă nouă</h1>
  <form method="POST">
    <label>Parolă nouă<input type="password" name="password" required></label>
    <button type="submit">Resetează parola</button>
  </form>
</div>
</body>
</html>
